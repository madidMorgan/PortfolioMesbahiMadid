<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logoPortfolio.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Portfolio | Madid Mesbahi - Électrotechnique & IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            dark: '#0a192f',
                            light: '#112240',
                            accent: '#233554'
                        },
                        accent: {
                            DEFAULT: '#64ffda',
                            dark: '#57cbff'
                        },
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'slide-down': 'slideDown 0.4s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'blob': 'blob 7s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #cbd5e1;
        }
        .glass-nav {
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }
        .nav-link {
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #64ffda;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        .project-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -15px rgba(2, 12, 27, 0.7);
            border-color: rgba(100, 255, 218, 0.3);
        }
        .skill-bar {
            position: relative;
            overflow: hidden;
        }
        .skill-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #64ffda, #57cbff);
            width: var(--progress);
            transition: width 1.5s ease-out;
        }
        .gradient-text {
            background: linear-gradient(135deg, #64ffda 0%, #57cbff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a192f;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #233554;
            border-radius: 4px;
        }
        .dropdown-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 360px;
            width: min(760px, calc(100vw - 2rem));
        }
        .dropdown:hover .dropdown-menu,
        .dropdown:focus-within .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-card {
            text-align: left;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(100, 255, 218, 0.12);
            border-radius: 12px;
            padding: 12px 14px;
            transition: all 0.2s ease;
        }
        .dropdown-card:hover {
            background: rgba(100, 255, 218, 0.08);
            border-color: rgba(100, 255, 218, 0.25);
            transform: translateY(-2px);
        }
        .hero-bg {
            background: radial-gradient(circle at 50% 50%, rgba(100, 255, 218, 0.05) 0%, transparent 50%);
        }
        .grid-pattern {
            background-image: radial-gradient(rgba(100, 255, 218, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .domain-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .domain-card:hover {
            transform: translateY(-5px);
            border-color: rgba(100, 255, 218, 0.5);
            box-shadow: 0 20px 40px -18px rgba(2, 12, 27, 0.75);
        }
        .contact-link {
            transition: all 0.3s ease;
        }
        .contact-link:hover {
            transform: translateX(10px);
            color: #64ffda;
        }
        .about-card {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(100, 255, 218, 0.12);
            box-shadow: 0 24px 50px -24px rgba(2, 12, 27, 0.8);
        }
        .about-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at top left, rgba(100, 255, 218, 0.12), transparent 34%),
                radial-gradient(circle at bottom right, rgba(87, 203, 255, 0.08), transparent 28%);
        }
        .cv-download-section {
            margin-top: 1.5rem;
        }
        .cv-download-card {
            max-width: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.86), rgba(2, 6, 23, 0.74));
            border: 1px solid rgba(100, 255, 218, 0.16);
            box-shadow: 0 18px 40px -24px rgba(2, 12, 27, 0.95);
            backdrop-filter: blur(14px);
        }
        .cv-download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: min(100%, 280px);
            padding: 0.85rem 1.25rem;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #64ffda, #57cbff);
            color: #020617;
            font-weight: 700;
            box-shadow: 0 12px 28px rgba(100, 255, 218, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .cv-download-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 34px rgba(100, 255, 218, 0.24);
            filter: brightness(1.06);
        }
        .premium-hover {
            transition:
                transform 0.23s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.23s ease,
                box-shadow 0.23s ease;
        }
        .premium-hover:hover {
            transform: translateY(-6px);
            border-color: rgba(100, 255, 218, 0.35);
            box-shadow:
                0 28px 60px -28px rgba(2, 12, 27, 0.88),
                0 0 28px rgba(100, 255, 218, 0.08);
        }
        .skill-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1rem;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(100, 255, 218, 0.12);
            color: #cbd5e1;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        .skill-pill:hover {
            color: #64ffda;
            border-color: rgba(100, 255, 218, 0.42);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(100, 255, 218, 0.08);
        }
        .stat-card {
            background: rgba(2, 6, 23, 0.62);
            border: 1px solid rgba(100, 255, 218, 0.12);
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(100, 255, 218, 0.35);
            box-shadow: 0 16px 36px rgba(2, 12, 27, 0.45);
        }
        .timeline-card {
            position: relative;
            padding: 1.5rem;
            border-radius: 1.25rem;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(100, 255, 218, 0.12);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 44px -24px rgba(2, 12, 27, 0.85);
            transition:
                transform 0.23s ease,
                border-color 0.23s ease,
                box-shadow 0.23s ease;
        }
        .timeline-card:hover {
            transform: translateY(-6px);
            border-color: rgba(100, 255, 218, 0.4);
            box-shadow:
                0 28px 60px -28px rgba(2, 12, 27, 0.9),
                0 0 26px rgba(100, 255, 218, 0.06);
        }
        .project-card {
            transition:
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background-color 0.3s ease;
            will-change: transform;
        }
        .project-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow:
                0 28px 60px -24px rgba(2, 12, 27, 0.82),
                0 0 35px rgba(100, 255, 218, 0.06);
        }
        .project-modal-shell {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.96)),
                radial-gradient(circle at top left, rgba(100, 255, 218, 0.12), transparent 32%);
            border: 1px solid rgba(100, 255, 218, 0.16);
            box-shadow:
                0 34px 90px -34px rgba(2, 12, 27, 0.95),
                0 0 44px rgba(100, 255, 218, 0.06);
            backdrop-filter: blur(18px);
        }
        .project-modal-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.1), transparent) top / 100% 1px no-repeat,
                radial-gradient(circle at 18% 0%, rgba(87, 203, 255, 0.12), transparent 26%);
        }
        .project-modal-flow {
            position: relative;
            z-index: 1;
        }
        .project-modal-animate {
            animation: projectFadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: var(--project-delay, 0ms);
        }
        .project-hero-card,
        .project-detail-card,
        .project-media-frame {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.58);
            border: 1px solid rgba(100, 255, 218, 0.13);
            backdrop-filter: blur(16px);
            box-shadow: 0 22px 54px -30px rgba(2, 12, 27, 0.92);
            transition:
                transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.28s ease,
                box-shadow 0.28s ease,
                background 0.28s ease;
        }
        .project-detail-card::before,
        .project-media-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(100, 255, 218, 0.08), transparent 38%),
                linear-gradient(90deg, rgba(100, 255, 218, 0.16), rgba(87, 203, 255, 0.04), transparent) top / 100% 1px no-repeat;
            opacity: 0.76;
        }
        .project-detail-card > *,
        .project-media-frame > * {
            position: relative;
            z-index: 1;
        }
        .project-detail-card:hover,
        .project-media-frame:hover {
            transform: translateY(-5px);
            border-color: rgba(100, 255, 218, 0.28);
            background: rgba(15, 23, 42, 0.68);
            box-shadow:
                0 30px 68px -34px rgba(2, 12, 27, 0.95),
                0 0 30px rgba(100, 255, 218, 0.07);
        }
        .project-hero-card {
            border-radius: 1.5rem;
        }
        .project-hero-card img,
        .project-media-frame img,
        .project-gallery-card img {
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.3s ease;
        }
        .project-hero-card:hover img,
        .project-gallery-card:hover img {
            transform: scale(1.035);
            filter: saturate(1.08) contrast(1.04);
        }
        .project-section-title {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #e2e8f0;
            letter-spacing: 0;
        }
        .project-section-title::before {
            content: '';
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #64ffda, #57cbff);
            box-shadow: 0 0 18px rgba(100, 255, 218, 0.42);
        }
        .project-title-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #dbeafe 42%, #64ffda 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .project-body-text {
            color: #aebcd0;
            line-height: 1.8;
        }
        .project-result-card {
            background:
                linear-gradient(135deg, rgba(100, 255, 218, 0.08), rgba(87, 203, 255, 0.04)),
                rgba(2, 6, 23, 0.38);
            border: 1px solid rgba(100, 255, 218, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .project-chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: rgba(100, 255, 218, 0.08);
            border: 1px solid rgba(100, 255, 218, 0.18);
            color: #64ffda;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .project-chip:hover {
            transform: translateY(-2px);
            background: rgba(100, 255, 218, 0.12);
            border-color: rgba(100, 255, 218, 0.36);
        }
        .project-action-link {
            background: rgba(15, 23, 42, 0.62);
            border: 1px solid rgba(100, 255, 218, 0.1);
            color: #cbd5e1;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }
        .project-action-link:hover {
            transform: translateX(4px);
            background: rgba(100, 255, 218, 0.09);
            border-color: rgba(100, 255, 218, 0.3);
            color: #64ffda;
        }
        .project-video-frame {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 1rem;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(100, 255, 218, 0.14);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 22px 54px -34px rgba(2, 12, 27, 0.96);
        }
        .project-video-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.08), transparent 32%);
        }
        .project-video-embed {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: inherit;
            background: #020617;
        }
        .project-video-open-preview {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            gap: 0.75rem;
            padding: 2rem;
            text-align: center;
            color: #e2e8f0;
            background:
                linear-gradient(135deg, rgba(100, 255, 218, 0.12), transparent 42%),
                rgba(2, 6, 23, 0.78);
            transition: color 0.2s ease, background 0.2s ease;
        }
        .project-video-open-preview span {
            color: #64ffda;
            font-size: 1.05rem;
            font-weight: 700;
        }
        .project-video-open-preview small {
            max-width: 32rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        .project-video-open-preview:hover {
            color: #64ffda;
            background:
                linear-gradient(135deg, rgba(100, 255, 218, 0.16), transparent 48%),
                rgba(2, 6, 23, 0.86);
        }
        .project-video-card:hover .project-video-frame {
            border-color: rgba(100, 255, 218, 0.28);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 24px 58px -34px rgba(2, 12, 27, 0.98),
                0 0 26px rgba(100, 255, 218, 0.06);
        }
        .project-video-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            color: #64ffda;
            background: rgba(100, 255, 218, 0.08);
            border: 1px solid rgba(100, 255, 218, 0.18);
            border-radius: 999px;
            padding: 0.65rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .project-video-fallback:hover {
            transform: translateY(-2px);
            background: rgba(100, 255, 218, 0.13);
            border-color: rgba(100, 255, 218, 0.38);
        }
        .project-detail-card pre,
        .project-detail-card code,
        .project-code-card pre,
        .project-code-card code {
            font-family: 'Fira Code', monospace;
        }
        .project-detail-card pre,
        .project-code-card pre {
            position: relative;
            overflow-x: auto;
            margin-top: 1rem;
            padding: 3.25rem 1.25rem 1.25rem;
            border-radius: 1rem;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(100, 255, 218, 0.16);
            box-shadow: 0 18px 44px -28px rgba(2, 12, 27, 0.96);
        }
        .project-detail-card pre::before,
        .project-code-card pre::before {
            content: '';
            position: absolute;
            top: 1.1rem;
            left: 1.1rem;
            width: 0.72rem;
            height: 0.72rem;
            border-radius: 999px;
            background: #ff5f57;
            box-shadow: 1.15rem 0 #ffbd2e, 2.3rem 0 #28c840;
        }
        @keyframes projectFadeUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.99);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .timeline-progress {
            left: calc(50% - 1px);
            transform: scaleY(0);
            transform-origin: top;
            opacity: 0.25;
            transition:
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.40s ease;
            transition-delay: var(--reveal-delay, 0ms);
        }
        .timeline-progress.is-visible,
        .timeline-progress.active {
            transform: scaleY(1);
            opacity: 1;
        }
        .timeline-dot {
            width: 1rem;
            height: 1rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #64ffda, #57cbff);
            box-shadow: 0 0 0 6px rgba(100, 255, 218, 0.08), 0 0 24px rgba(100, 255, 218, 0.45);
            opacity: 0.15;
            left: calc(50% - 0.5rem);
            transform: translateY(-50%) scale(0.18);
            transition:
                opacity 0.30s ease,
                transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.30s ease;
            transition-delay: calc(var(--reveal-delay, 0ms) + 44ms);
        }
        .timeline-dot.is-visible,
        .timeline-dot.active {
            opacity: 1;
            transform: translateY(-50%) scale(1);
            box-shadow: 0 0 0 8px rgba(100, 255, 218, 0.08), 0 0 28px rgba(100, 255, 218, 0.52);
        }
        .scroll-reveal {
            --reveal-x: 0px;
            --reveal-y: 50px;
            --reveal-scale: 0.985;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(
                calc(var(--tw-translate-x, 0px) + var(--reveal-x)),
                calc(var(--tw-translate-y, 0px) + var(--reveal-y)),
                0
            ) scale(var(--reveal-scale)) !important;
            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                filter 0.45s ease;
            transition-delay: var(--reveal-delay, 0ms);
            will-change: transform, opacity, filter;
        }
        .scroll-reveal.is-visible,
        .scroll-reveal.active {
            --reveal-x: 0px;
            --reveal-y: 0px;
            --reveal-scale: 1;
            opacity: 1;
            filter: blur(0);
        }
        .reveal-left {
            --reveal-x: -72px;
            --reveal-y: 0px;
        }
        .reveal-right {
            --reveal-x: 72px;
            --reveal-y: 0px;
        }
        .reveal-bottom {
            --reveal-y: 50px;
        }
        .reveal-left.is-visible,
        .reveal-right.is-visible,
        .reveal-bottom.is-visible,
        .reveal-left.active,
        .reveal-right.active,
        .reveal-bottom.active {
            opacity: 1;
            filter: blur(0);
        }
        @media (max-width: 767px) {
            .reveal-left,
            .reveal-right {
                --reveal-x: 0px;
                --reveal-y: 44px;
            }
            .timeline-progress {
                left: calc(0.75rem - 1px);
                transform: scaleY(0);
            }
            .timeline-dot {
                left: calc(0.75rem - 0.5rem);
                transform: translateY(-50%) scale(0.18);
            }
            .timeline-dot.is-visible,
            .timeline-dot.active {
                transform: translateY(-50%) scale(1);
            }
            .timeline-progress.is-visible,
            .timeline-progress.active {
                transform: scaleY(1);
            }
        }
        @media (prefers-reduced-motion: reduce) {

        function copyToClipboard(text, button) {
            if (!text || !navigator?.clipboard || !button) return;
            const label = button.querySelector('[data-copy-label]');
            const iconCopy = button.querySelector('[data-icon-copy]');
            const iconCheck = button.querySelector('[data-icon-check]');
            const originalLabel = label ? label.textContent : 'Copier';
            navigator.clipboard.writeText(text).then(() => {
                if (label) label.textContent = 'Copié !';
                button.classList.add('bg-accent/20', 'border-accent/60', 'text-accent', 'scale-95');
                if (iconCopy && iconCheck) {
                    iconCopy.classList.add('hidden');
                    iconCheck.classList.remove('hidden');
                }
                setTimeout(() => {
                    if (label) label.textContent = originalLabel;
                    button.classList.remove('bg-accent/20', 'border-accent/60', 'text-accent', 'scale-95');
                    if (iconCopy && iconCheck) {
                        iconCopy.classList.remove('hidden');
                        iconCheck.classList.add('hidden');
                    }
                }, 1500);
            }).catch(console.error);
        }

        let revealObserver = null;

            const timelineElements = Array.from(root.querySelectorAll('.timeline-dot, .timeline-progress'));
            const reducedMotion = shouldReduceMotion();
            const isMobileViewport = window.matchMedia('(max-width: 767px)').matches;

            if (reducedMotion) {

                `;

            },
            renderContact() {

                                <div class="contact-link flex items-center gap-6 p-6 bg-slate-800/30 rounded-xl border border-slate-700 hover:border-accent/30 group scroll-reveal reveal-bottom" style="--reveal-delay: 90ms">
                                    <div class="w-14 h-14 bg-accent/10 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-accent/20 transition-colors">

                                    <div class="w-14 h-14 bg-accent/10 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-accent/20 transition-colors">

                    </section>
                `;
            },
            renderDomainPage(domainKey) {
                const domaine = DOMAINES[domainKey];
                const projetsAssocies = domaine.projets.map(id => modal.findProject(id)).filter(Boolean);
                return `
                    <section class="min-h-screen py-20">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <button onclick="router.navigate('home')" class="mb-8 text-accent hover:text-accent/80 flex items-center gap-2 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Retour à l'accueil
                            </button>
                            <div class="grid lg:grid-cols-3 gap-12 mb-16">
                                <div class="lg:col-span-2 scroll-reveal reveal-left">
                                    <div class="flex items-center gap-4 mb-6">
                                        <div class="w-16 h-16 bg-accent/10 rounded-2xl flex items-center justify-center">
                                            <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${domaine.icon}"></path></svg>
                                        </div>
                                        <div>
                                            <h1 class="text-4xl font-bold text-white">${domaine.titre}</h1>
                                            <p class="text-slate-400 mt-2 text-lg">${domaine.description}</p>
                                        </div>
                                    </div>
                                    <div class="prose prose-invert max-w-none">
                                        <h3 class="text-2xl font-semibold text-white mb-4">Expertise Détaillée</h3>
                                        <p class="text-slate-400 leading-relaxed mb-6 text-lg">${domaine.details}</p>
                                        <h3 class="text-2xl font-semibold text-white mb-4">Technologies Maîtrisées</h3>
                                        <div class="flex flex-wrap gap-3 mb-8">
                                            ${domaine.technologies.map(tech => `
                                                <span class="px-4 py-2 bg-accent/10 text-accent rounded-lg border border-accent/20 font-medium">
                                                    ${tech}
                                                </span>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="lg:col-span-1 scroll-reveal reveal-right" style="--reveal-delay: 200ms">
                                    <div class="bg-slate-800/30 rounded-2xl p-8 border border-slate-700 sticky top-24">
                                        <h3 class="text-xl font-bold text-white mb-6">Formation Associée</h3>
                                        <ul class="space-y-4">
                                            <li class="flex items-start gap-3">
                                                <svg class="w-5 h-5 text-accent mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                <span class="text-slate-300">${INFO.universite}</span>
                                            </li>
                                            <li class="flex items-start gap-3">
                                                <svg class="w-5 h-5 text-accent mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                <span class="text-slate-300">${INFO.specialisation}</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div class="border-t border-slate-800 pt-16 scroll-reveal reveal-bottom" style="--reveal-delay: 300ms">
                                <h2 class="text-3xl font-bold text-white mb-8">Projets Associés</h2>
                                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch">
                                    ${projetsAssocies.map((projet, index) => this.createProjectCard(projet, index)).join('')}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
            },
            createProjectCard(projet, index = 0) {
                return `
                    <div class="project-card group relative bg-slate-800/30 rounded-xl overflow-hidden border border-slate-700 hover:border-accent/30 scroll-reveal reveal-bottom h-full flex flex-col" style="--reveal-delay: ${index * 100}ms" onclick="modal.open('${projet.id}')">
                        <div class="relative h-48 overflow-hidden">
                            <img src="${projet.image}" alt="${projet.titre}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                            <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="px-6 py-2 bg-accent/20 border border-accent rounded-full text-accent text-sm font-medium backdrop-blur-sm">Voir Détails</span>
                            </div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-mono text-accent">${projet.categorie}</span>
                                <svg class="w-5 h-5 text-slate-500 group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2 group-hover:text-accent transition-colors">${projet.titre}</h3>
                            <p class="text-slate-400 text-sm line-clamp-2 flex-1">${projet.resume}</p>
                            <div class="mt-4 flex flex-wrap gap-2">
                                ${projet.outils.slice(0, 3).map(outil => `<span class="text-xs px-2 py-1 bg-slate-700/50 text-slate-300 rounded">${outil}</span>`).join('')}
                                ${projet.outils.length > 3 ? `<span class="text-xs px-2 py-1 text-slate-500">+${projet.outils.length - 3}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },
            createCompetenceProjectCard(projet, index = 0, categoryOrSubSkill) {
                const categoryKey = typeof categoryOrSubSkill === 'string'
                    ? categoryOrSubSkill
                    : categoryOrSubSkill?.category;
                const category = COMPETENCE_CATEGORIES[categoryKey];
                const detailKey = buildCompetenceProjectKey(categoryKey, projet.id);
                const justificationCount = getCategoryProjectJustifications(categoryKey, projet).length;
                return `
                    <div class="project-card group relative bg-slate-800/30 rounded-xl overflow-hidden border border-slate-700 ${category.theme.hover} scroll-reveal reveal-bottom h-full flex flex-col" style="--reveal-delay: ${index * 100}ms" onclick="router.navigate('competence-project-detail', '${escapeJs(detailKey)}')">
                        <div class="relative h-48 overflow-hidden">
                            <img src="${projet.image}" alt="${escapeHtml(projet.titre)}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                            <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="px-6 py-2 ${category.theme.bg} border ${category.theme.border} rounded-full ${category.theme.text} text-sm font-medium backdrop-blur-sm">Voir les preuves</span>
                            </div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-mono ${category.theme.text}">${projet.categorie}</span>
                                <svg class="w-5 h-5 text-slate-500 ${category.theme.groupText} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2 ${category.theme.groupText} transition-colors">${escapeHtml(projet.titre)}</h3>
                            <p class="text-slate-400 text-sm line-clamp-2 flex-1">${justificationCount} justification(s) pour ${escapeHtml(category.titre)} : ${escapeHtml(projet.resume)}</p>
                        </div>
                    </div>
                `;
            }
        };
        // ==========================================
        // 9. INITIALISATION
        // ==========================================
        // Au chargement : construction des menus dynamiques puis affichage de l'accueil.
        document.addEventListener('DOMContentLoaded', () => {
            renderSkillNavigation();
            router.navigate('home');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') modal.close();
        });
    </script>
</body>
</html>
